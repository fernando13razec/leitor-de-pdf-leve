# Verificação estática e testes automáticos a cada envio para a main e em pull requests.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificação estática (pyflakes)
        run: python -m pyflakes pdf_leve testes ferramentas iniciar.pyw

      - name: Testes automáticos
        run: python -m unittest discover -s testes -t . -v
