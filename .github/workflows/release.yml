# Gera o executável para Windows e publica a Release.
#
# - Ao enviar uma tag de versão (ex.: `git tag v1.0.1 && git push origin v1.0.1`): testa, gera o
#   executável, assina (se a SignPath estiver configurada) e publica a Release com o zip.
# - Manualmente (Actions → Release → Run workflow): só gera o executável e o disponibiliza como
#   artefato da execução, sem publicar nada — útil para testar.
#
# Assinatura digital (SignPath Foundation): fica desligada até as variáveis e o segredo abaixo
# existirem no repositório (Settings → Secrets and variables → Actions). Veja
# docs/assinatura-de-codigo.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # para criar a Release

jobs:
  executavel:
    runs-on: windows-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      artefato_id: ${{ steps.artefato.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes automáticos
        run: python -m unittest discover -s testes -t . -v

      - name: Ler a versão do código
        id: versao
        shell: bash
        run: echo "versao=$(python ferramentas/gerar_executavel.py --versao)" >> "$GITHUB_OUTPUT"

      - name: Conferir se a tag corresponde à versão do código
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.versao.outputs.versao }}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não corresponde a VERSAO = ${{ steps.versao.outputs.versao }} (pdf_leve/configuracao/constantes.py)"
            exit 1
          fi

      - name: Gerar o executável
        run: python ferramentas/gerar_executavel.py --etapa executavel

      - name: Guardar o executável (ainda sem assinatura)
        id: artefato
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Leve-${{ steps.versao.outputs.versao }}-sem-assinatura
          path: dist/PDF Leve/
          if-no-files-found: error

  publicar:
    needs: executavel
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      VERSAO: ${{ needs.executavel.outputs.versao }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Baixar o executável gerado
        uses: actions/download-artifact@v4
        with:
          name: PDF-Leve-${{ env.VERSAO }}-sem-assinatura
          path: dist/PDF Leve

      # ---------------------------------------------------------------- assinatura (SignPath)
      # Ativada quando a variável SIGNPATH_ORGANIZATION_ID existir no repositório.
      - name: Assinar com a SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.executavel.outputs.artefato_id }}
          wait-for-completion: true
          output-artifact-directory: dist/PDF Leve

      - name: Compactar
        run: python ferramentas/gerar_executavel.py --etapa zip

      - name: Publicar a Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{VERSAO}/${VERSAO}/g" .github/notas_release.md > notas.md
          echo -e "\n**SHA-256** do zip: \`$(sha256sum "dist/PDF-Leve-${VERSAO}-windows-x64.zip" | cut -d' ' -f1)\`" >> notas.md
          gh release create "${GITHUB_REF_NAME}" "dist/PDF-Leve-${VERSAO}-windows-x64.zip" \
            --title "PDF Leve ${VERSAO}" --notes-file notas.md --generate-notes --verify-tag
